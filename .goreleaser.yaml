version: 2

project_name: mcp-jetkvm

before:
  hooks:
    - go mod tidy

builds:
  - id: mcp-jetkvm
    main: ./cmd/mcp-jetkvm
    binary: mcp-jetkvm
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: mcp-jetkvm
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

# Multi-arch image for running the HTTP transport in a container (the lab runs
# it on arm64 Kubernetes nodes). Needs QEMU + buildx on the runner, see
# .github/workflows/release.yml.
dockers_v2:
  - id: mcp-jetkvm
    ids: [mcp-jetkvm]
    images:
      - ghcr.io/conallob/mcp-jetkvm
    tags:
      - "{{ .Version }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64

checksum:
  name_template: checksums.txt

brews:
  - name: mcp-jetkvm
    repository:
      owner: conallob
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/conallob/mcp-jetkvm
    description: MCP server for JetKVM device control, screenshots, and video capture
    license: BSD-3-Clause
    dependencies:
      - name: ffmpeg
    install: |
      bin.install "mcp-jetkvm"
    test: |
      assert_match version.to_s, shell_output("#{bin}/mcp-jetkvm --version")

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
